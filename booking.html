<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Book an Appointment | AppointmentOS</title>

    <!-- Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            background: #f5f7fb;
            color: #172033;
        }

        header {
            height: 70px;
            background: #071a3d;
            color: white;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 7%;
        }

        .logo {
            font-size: 24px;
            font-weight: bold;
        }

        .logo span {
            color: #4da3ff;
        }

        .home {
            color: white;
            text-decoration: none;
            font-size: 15px;
        }

        main {
            max-width: 850px;
            margin: 45px auto;
            padding: 0 20px;
        }

        .title {
            text-align: center;
            margin-bottom: 30px;
        }

        .title h1 {
            font-size: 34px;
            margin-bottom: 10px;
        }

        .title p {
            color: #667085;
        }

        .card {
            background: white;
            padding: 35px;
            border-radius: 16px;
            box-shadow: 0 8px 30px rgba(0,0,0,0.06);
        }

        .business {
            background: #eef4ff;
            padding: 18px;
            border-radius: 10px;
            margin-bottom: 25px;
        }

        .business h2 {
            font-size: 20px;
            margin-bottom: 5px;
        }

        .business p {
            color: #667085;
            font-size: 14px;
        }

        .loading {
            text-align: center;
            padding: 30px;
            color: #667085;
        }

        .error {
            display: none;
            background: #fff0f0;
            color: #b42318;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            font-weight: bold;
            margin-bottom: 8px;
            font-size: 14px;
        }

        input,
        select,
        textarea {
            width: 100%;
            padding: 13px;
            border: 1px solid #d8dee9;
            border-radius: 8px;
            font-size: 15px;
            background: white;
            outline: none;
        }

        input:focus,
        select:focus,
        textarea:focus {
            border-color: #2779ff;
        }

        .row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        button {
            width: 100%;
            padding: 15px;
            border: none;
            border-radius: 9px;
            background: #0b2a63;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 5px;
        }

        button:hover {
            background: #123b82;
        }

        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .success {
            display: none;
            text-align: center;
            padding: 25px;
        }

        .success-icon {
            font-size: 45px;
            margin-bottom: 15px;
        }

        .success h2 {
            margin-bottom: 10px;
        }

        .success p {
            color: #667085;
            line-height: 1.6;
        }

        .booking-details {
            background: #f5f7fb;
            padding: 18px;
            border-radius: 10px;
            margin-top: 20px;
            text-align: left;
        }

        .booking-details div {
            margin-bottom: 8px;
        }

        .booking-details div:last-child {
            margin-bottom: 0;
        }

        @media (max-width: 650px) {

            header {
                padding: 0 5%;
            }

            main {
                margin-top: 30px;
            }

            .title h1 {
                font-size: 28px;
            }

            .card {
                padding: 25px 20px;
            }

            .row {
                grid-template-columns: 1fr;
                gap: 0;
            }
        }
    </style>
</head>

<body>

<header>

    <div class="logo">
        Appointment<span>OS</span>
    </div>

    <a href="index.html" class="home">
        ← Home
    </a>

</header>


<main>

    <div class="title">

        <h1>Book an Appointment</h1>

        <p>
            Choose a service and a time that works for you.
        </p>

    </div>


    <div class="card">

        <div class="business">

            <div id="loadingBusiness" class="loading">
                Loading business...
            </div>

            <div id="businessInfo" style="display: none;">

                <h2 id="businessName"></h2>

                <p id="businessDescription"></p>

            </div>

        </div>


        <div id="errorMessage" class="error"></div>


        <form id="bookingForm" style="display: none;">

            <div class="form-group">

                <label for="customerName">
                    Your Name
                </label>

                <input
                    type="text"
                    id="customerName"
                    placeholder="Enter your full name"
                    required
                >

            </div>


            <div class="row">

                <div class="form-group">

                    <label for="phone">
                        Phone Number
                    </label>

                    <input
                        type="tel"
                        id="phone"
                        placeholder="071 123 4567"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="email">
                        Email
                    </label>

                    <input
                        type="email"
                        id="email"
                        placeholder="you@example.com"
                    >

                </div>

            </div>


            <div class="form-group">

                <label for="service">
                    Choose a Service
                </label>

                <select id="service" required>

                    <option value="">
                        Select a service
                    </option>

                    <option value="Haircut">
                        Haircut
                    </option>

                    <option value="Haircut & Beard">
                        Haircut & Beard
                    </option>

                    <option value="Consultation">
                        Consultation
                    </option>

                    <option value="General Appointment">
                        General Appointment
                    </option>

                </select>

            </div>


            <div class="row">

                <div class="form-group">

                    <label for="date">
                        Appointment Date
                    </label>

                    <input
                        type="date"
                        id="date"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="time">
                        Appointment Time
                    </label>

                    <input
                        type="time"
                        id="time"
                        required
                    >

                </div>

            </div>


            <div class="form-group">

                <label for="notes">
                    Additional Notes
                </label>

                <textarea
                    id="notes"
                    placeholder="Anything the business should know?"
                ></textarea>

            </div>


            <button type="submit" id="bookButton">
                Book Appointment
            </button>

        </form>


        <div class="success" id="success">

            <div class="success-icon">
                ✓
            </div>

            <h2>Appointment Request Created</h2>

            <p>
                Your appointment has been sent to the business.
            </p>


            <div class="booking-details">

                <div>
                    <strong>Name:</strong>
                    <span id="showName"></span>
                </div>

                <div>
                    <strong>Service:</strong>
                    <span id="showService"></span>
                </div>

                <div>
                    <strong>Date:</strong>
                    <span id="showDate"></span>
                </div>

                <div>
                    <strong>Time:</strong>
                    <span id="showTime"></span>
                </div>

            </div>

        </div>

    </div>

</main>


<script>

    // ==========================================
    // SUPABASE CONNECTION
    // ==========================================

    const SUPABASE_URL =
        "https://jnkfzfmijjdmtebrzrux.supabase.co";

    const SUPABASE_KEY =
        "sb_publishable_8hpsNfMPCgeP34IPnjhhrg_BVHKyHET";

    const { createClient } = supabase;

    const db = createClient(
        SUPABASE_URL,
        SUPABASE_KEY
    );


    // ==========================================
    // GET BUSINESS SLUG
    // ==========================================

    const urlParams = new URLSearchParams(
        window.location.search
    );

    const businessSlug =
        urlParams.get("business");


    // ==========================================
    // PAGE ELEMENTS
    // ==========================================

    const loadingBusiness =
        document.getElementById("loadingBusiness");

    const businessInfo =
        document.getElementById("businessInfo");

    const businessName =
        document.getElementById("businessName");

    const businessDescription =
        document.getElementById("businessDescription");

    const bookingForm =
        document.getElementById("bookingForm");

    const errorMessage =
        document.getElementById("errorMessage");


    let currentBusiness = null;


    // ==========================================
    // SHOW ERROR
    // ==========================================

    function showError(message) {

        loadingBusiness.style.display = "none";

        errorMessage.textContent = message;

        errorMessage.style.display = "block";
    }


    // ==========================================
    // LOAD BUSINESS
    // ==========================================

    async function loadBusiness() {

        if (!businessSlug) {

            showError(
                "No business was specified."
            );

            return;
        }


        const { data, error } = await db
            .from("businesses")
            .select("*")
            .eq("slug", businessSlug)
            .single();


        if (error) {

            console.error(
                "Business loading error:",
                error
            );

            showError(
                "We could not find this business."
            );

            return;
        }


        if (!data) {

            showError(
                "Business not found."
            );

            return;
        }


        currentBusiness = data;


        businessName.textContent =
            data.name;

        businessDescription.textContent =
            data.description ||
            "Select your service and appointment time below.";


        loadingBusiness.style.display =
            "none";

        businessInfo.style.display =
            "block";

        bookingForm.style.display =
            "block";
    }


    // ==========================================
    // BOOK APPOINTMENT
    // ==========================================

    bookingForm.addEventListener(
        "submit",
        async function(event) {

            event.preventDefault();


            const bookButton =
                document.getElementById(
                    "bookButton"
                );

            bookButton.disabled = true;

            bookButton.textContent =
                "Booking...";


            const name =
                document.getElementById(
                    "customerName"
                ).value.trim();

            const phone =
                document.getElementById(
                    "phone"
                ).value.trim();

            const email =
                document.getElementById(
                    "email"
                ).value.trim();

            const service =
                document.getElementById(
                    "service"
                ).value;

            const date =
                document.getElementById(
                    "date"
                ).value;

            const time =
                document.getElementById(
                    "time"
                ).value;

            const notes =
                document.getElementById(
                    "notes"
                ).value.trim();


            console.log(
                "Booking for business:",
                currentBusiness
            );


            // ==================================
            // SAVE APPOINTMENT
            // ==================================

            const { data, error } = await db
                .from("appointments")
                .insert([
                    {
                        business_id:
                            currentBusiness.id,

                        customer:
                            name,

                        phone:
                            phone,

                        email:
                            email || null,

                        service:
                            service,

                        date:
                            date,

                        time:
                            time,

                        notes:
                            notes || null
                    }
                ]);


            if (error) {

                console.error(
                    "Booking error:",
                    error
                );

                alert(
                    "Something went wrong: " +
                    error.message
                );

                bookButton.disabled = false;

                bookButton.textContent =
                    "Book Appointment";

                return;
            }


            // ==================================
            // SHOW SUCCESS
            // ==================================

            document.getElementById(
                "showName"
            ).textContent = name;

            document.getElementById(
                "showService"
            ).textContent = service;

            document.getElementById(
                "showDate"
            ).textContent = date;

            document.getElementById(
                "showTime"
            ).textContent = time;


            bookingForm.style.display =
                "none";

            document.getElementById(
                "success"
            ).style.display =
                "block";

        }
    );


    // ==========================================
    // START
    // ==========================================

    loadBusiness();

</script>

</body>
</html>
