<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Book an Appointment | AppointmentOS</title>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            background: #f5f7fb;
            color: #172033;
        }

        header {
            height: 70px;
            background: #071a3d;
            color: white;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 7%;
        }

        .logo {
            font-size: 24px;
            font-weight: bold;
        }

        .logo span {
            color: #4da3ff;
        }

        .home {
            color: white;
            text-decoration: none;
            font-size: 15px;
        }

        main {
            max-width: 850px;
            margin: 45px auto;
            padding: 0 20px;
        }

        .title {
            text-align: center;
            margin-bottom: 30px;
        }

        .title h1 {
            font-size: 34px;
            margin-bottom: 10px;
        }

        .title p {
            color: #667085;
        }

        .card {
            background: white;
            padding: 35px;
            border-radius: 16px;
            box-shadow: 0 8px 30px rgba(0,0,0,0.06);
        }

        .business {
            background: #eef4ff;
            padding: 18px;
            border-radius: 10px;
            margin-bottom: 25px;
        }

        .business h2 {
            font-size: 20px;
            margin-bottom: 5px;
        }

        .business p {
            color: #667085;
            font-size: 14px;
        }

        .loading {
            text-align: center;
            padding: 30px;
            color: #667085;
        }

        .error {
            display: none;
            background: #fff0f0;
            color: #b42318;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            font-weight: bold;
            margin-bottom: 8px;
            font-size: 14px;
        }

        input,
        select,
        textarea {
            width: 100%;
            padding: 13px;
            border: 1px solid #d8dee9;
            border-radius: 8px;
            font-size: 15px;
            background: white;
            outline: none;
        }

        input:focus,
        select:focus,
        textarea:focus {
            border-color: #2779ff;
        }

        .row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        .service-info {
            display: none;
            background: #eef4ff;
            border-radius: 8px;
            padding: 12px 15px;
            margin-top: 10px;
            color: #172033;
            font-size: 14px;
        }

        .service-info strong {
            color: #0b2a63;
        }

        button {
            width: 100%;
            padding: 15px;
            border: none;
            border-radius: 9px;
            background: #0b2a63;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 5px;
        }

        button:hover {
            background: #123b82;
        }

        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .success {
            display: none;
            text-align: center;
            padding: 25px;
        }

        .success-icon {
            font-size: 45px;
            margin-bottom: 15px;
        }

        .success h2 {
            margin-bottom: 10px;
        }

        .success p {
            color: #667085;
            line-height: 1.6;
        }

        .booking-details {
            background: #f5f7fb;
            padding: 18px;
            border-radius: 10px;
            margin-top: 20px;
            text-align: left;
        }

        .booking-details div {
            margin-bottom: 8px;
        }

        .booking-details div:last-child {
            margin-bottom: 0;
        }

        @media (max-width: 650px) {

            header {
                padding: 0 5%;
            }

            main {
                margin-top: 30px;
            }

            .title h1 {
                font-size: 28px;
            }

            .card {
                padding: 25px 20px;
            }

            .row {
                grid-template-columns: 1fr;
                gap: 0;
            }
        }
    </style>
</head>

<body>

<header>

    <div class="logo">
        Appointment<span>OS</span>
    </div>

    <a href="index.html" class="home">
        ← Home
    </a>

</header>


<main>

    <div class="title">

        <h1>Book an Appointment</h1>

        <p>
            Choose a service and a time that works for you.
        </p>

    </div>


    <div class="card">

        <div class="business">

            <div id="loadingBusiness" class="loading">
                Loading business...
            </div>

            <div id="businessInfo" style="display: none;">

                <h2 id="businessName"></h2>

                <p id="businessDescription"></p>

            </div>

        </div>


        <div id="errorMessage" class="error"></div>


        <form id="bookingForm" style="display: none;">

            <div class="form-group">

                <label for="customerName">
                    Your Name
                </label>

                <input
                    type="text"
                    id="customerName"
                    placeholder="Enter your full name"
                    required
                >

            </div>


            <div class="row">

                <div class="form-group">

                    <label for="phone">
                        Phone Number
                    </label>

                    <input
                        type="tel"
                        id="phone"
                        placeholder="071 123 4567"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="email">
                        Email
                    </label>

                    <input
                        type="email"
                        id="email"
                        placeholder="you@example.com"
                    >

                </div>

            </div>


            <!-- SERVICES -->

            <div class="form-group">

                <label for="service">
                    Choose a Service
                </label>

                <select id="service" required>

                    <option value="">
                        Loading services...
                    </option>

                </select>


                <div id="serviceInfo" class="service-info">

                    <div>
                        <strong>Price:</strong>
                        <span id="servicePrice"></span>
                    </div>

                    <div>
                        <strong>Duration:</strong>
                        <span id="serviceDuration"></span>
                    </div>

                </div>

            </div>


            <div class="row">

                <div class="form-group">

                    <label for="date">
                        Appointment Date
                    </label>

                    <input
                        type="date"
                        id="date"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="time">
                        Appointment Time
                    </label>

                    <input
                        type="time"
                        id="time"
                        required
                    >

                </div>

            </div>


            <div class="form-group">

                <label for="notes">
                    Additional Notes
                </label>

                <textarea
                    id="notes"
                    placeholder="Anything the business should know?"
                ></textarea>

            </div>


            <button type="submit" id="bookButton">
                Book Appointment
            </button>

        </form>


        <div class="success" id="success">

            <div class="success-icon">
                ✓
            </div>

            <h2>Appointment Request Created</h2>

            <p>
                Your appointment has been sent to the business.
            </p>


            <div class="booking-details">

                <div>
                    <strong>Name:</strong>
                    <span id="showName"></span>
                </div>

                <div>
                    <strong>Service:</strong>
                    <span id="showService"></span>
                </div>

                <div>
                    <strong>Date:</strong>
                    <span id="showDate"></span>
                </div>

                <div>
                    <strong>Time:</strong>
                    <span id="showTime"></span>
                </div>

            </div>

        </div>

    </div>

</main>


<script>

    // ==========================================
    // SUPABASE
    // ==========================================

    const SUPABASE_URL =
        "https://jnkfzfmijjdmtebrzrux.supabase.co";

    const SUPABASE_KEY =
        "sb_publishable_8hpsNfMPCgeP34IPnjhhrg_BVHKyHET";

    const { createClient } = supabase;

    const db = createClient(
        SUPABASE_URL,
        SUPABASE_KEY
    );


    // ==========================================
    // GET BUSINESS SLUG
    // ==========================================

    const urlParams =
        new URLSearchParams(window.location.search);

    const businessSlug =
        urlParams.get("business");


    // ==========================================
    // ELEMENTS
    // ==========================================

    const loadingBusiness =
        document.getElementById("loadingBusiness");

    const businessInfo =
        document.getElementById("businessInfo");

    const businessName =
        document.getElementById("businessName");

    const businessDescription =
        document.getElementById("businessDescription");

    const bookingForm =
        document.getElementById("bookingForm");

    const errorMessage =
        document.getElementById("errorMessage");

    const serviceSelect =
        document.getElementById("service");

    const serviceInfo =
        document.getElementById("serviceInfo");

    const servicePrice =
        document.getElementById("servicePrice");

    const serviceDuration =
        document.getElementById("serviceDuration");


    let currentBusiness = null;

    let currentServices = [];


    // ==========================================
    // ERROR
    // ==========================================

    function showError(message) {

        loadingBusiness.style.display = "none";

        errorMessage.textContent = message;

        errorMessage.style.display = "block";

    }


    // ==========================================
    // LOAD BUSINESS
    // ==========================================

    async function loadBusiness() {

        if (!businessSlug) {

            showError(
                "No business was specified."
            );

            return;
        }


        const { data, error } = await db
            .from("businesses")
            .select("*")
            .eq("slug", businessSlug)
            .single();


        if (error) {

            console.error(
                "Business loading error:",
                error
            );

            showError(
                "We could not find this business."
            );

            return;
        }


        if (!data) {

            showError(
                "Business not found."
            );

            return;
        }


        currentBusiness = data;


        businessName.textContent =
            data.name;

        businessDescription.textContent =
            data.description ||
            "Select your service and appointment time below.";


        loadingBusiness.style.display =
            "none";

        businessInfo.style.display =
            "block";


        // Now load this business's services

        await loadServices();


        bookingForm.style.display =
            "block";

    }


    // ==========================================
    // LOAD SERVICES
    // ==========================================

    async function loadServices() {

        serviceSelect.innerHTML = `
            <option value="">
                Loading services...
            </option>
        `;


        const { data, error } = await db
            .from("services")
            .select("*")
            .eq("business_id", currentBusiness.id)
            .order("name");


        if (error) {

            console.error(
                "Services loading error:",
                error
            );

            serviceSelect.innerHTML = `
                <option value="">
                    Could not load services
                </option>
            `;

            showError(
                "The business was found, but its services could not be loaded."
            );

            return;
        }


        currentServices = data || [];


        serviceSelect.innerHTML = `
            <option value="">
                Select a service
            </option>
        `;


        if (currentServices.length === 0) {

            serviceSelect.innerHTML = `
                <option value="">
                    No services available
                </option>
            `;

            return;
        }


        currentServices.forEach(function(service) {

            const option =
                document.createElement("option");

            option.value =
                service.id;

            option.textContent =
                service.name;

            serviceSelect.appendChild(option);

        });

    }


    // ==========================================
    // SERVICE SELECTED
    // ==========================================

    serviceSelect.addEventListener(
        "change",
        function() {

            const selectedId =
                this.value;


            if (!selectedId) {

                serviceInfo.style.display =
                    "none";

                return;
            }


            const selectedService =
                currentServices.find(
                    function(service) {
                        return String(service.id) ===
                            String(selectedId);
                    }
                );


            if (!selectedService) {

                serviceInfo.style.display =
                    "none";

                return;
            }


            // Price

            if (
                selectedService.price === null ||
                selectedService.price === undefined
            ) {

                servicePrice.textContent =
                    "Price on request";

            } else {

                servicePrice.textContent =
                    "R" +
                    Number(selectedService.price)
                        .toFixed(2);

            }


            // Duration

            if (
                selectedService.duration_minutes
            ) {

                serviceDuration.textContent =
                    selectedService.duration_minutes +
                    " minutes";

            } else {

                serviceDuration.textContent =
                    "Not specified";

            }


            serviceInfo.style.display =
                "block";

        }
    );


    // ==========================================
    // BOOK APPOINTMENT
    // ==========================================

    bookingForm.addEventListener(
        "submit",
        async function(event) {

            event.preventDefault();


            if (!currentBusiness) {

                alert(
                    "Business information is missing."
                );

                return;
            }


            const bookButton =
                document.getElementById(
                    "bookButton"
                );


            bookButton.disabled = true;

            bookButton.textContent =
                "Booking...";


            const name =
                document.getElementById(
                    "customerName"
                ).value.trim();


            const phone =
                document.getElementById(
                    "phone"
                ).value.trim();


            const email =
                document.getElementById(
                    "email"
                ).value.trim();


            const serviceId =
                document.getElementById(
                    "service"
                ).value;


            const date =
                document.getElementById(
                    "date"
                ).value;


            const time =
                document.getElementById(
                    "time"
                ).value;


            const notes =
                document.getElementById(
                    "notes"
                ).value.trim();


            const selectedService =
                currentServices.find(
                    function(service) {
                        return String(service.id) ===
                            String(serviceId);
                    }
                );


            if (!selectedService) {

                alert(
                    "Please select a service."
                );

                bookButton.disabled = false;

                bookButton.textContent =
                    "Book Appointment";

                return;
            }


            // ==================================
            // SAVE APPOINTMENT
            // ==================================

            const { error } = await db
                .from("appointments")
                .insert([{

                    business_id:
                        currentBusiness.id,

                    service_id:
                        selectedService.id,

                    customer:
                        name,

                    phone:
                        phone,

                    email:
                        email || null,

                    service:
                        selectedService.name,

                    appointment_date:
                        date,

                    appointment_time:
                        time,

                    date:
                        date,

                    time:
                        time,

                    notes:
                        notes || null,

                    status:
                        "pending"

                }]);


            if (error) {

                console.error(
                    "Booking error:",
                    error
                );

                alert(
                    "Something went wrong: " +
                    error.message
                );

                bookButton.disabled = false;

                bookButton.textContent =
                    "Book Appointment";

                return;
            }


            // ==================================
            // SUCCESS
            // ==================================

            document.getElementById(
                "showName"
            ).textContent =
                name;


            document.getElementById(
                "showService"
            ).textContent =
                selectedService.name;


            document.getElementById(
                "showDate"
            ).textContent =
                date;


            document.getElementById(
                "showTime"
            ).textContent =
                time;


            bookingForm.style.display =
                "none";


            document.getElementById(
                "success"
            ).style.display =
                "block";

        }
    );


    // ==========================================
    // START
    // ==========================================

    loadBusiness();

</script>

</body>
</html>
