<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Login | AppointmentOS</title>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }


        body {
            font-family: Arial, Helvetica, sans-serif;
            min-height: 100vh;
            background: #03183d;
            color: #0b1838;

            display: flex;
            align-items: center;
            justify-content: center;

            padding: 25px;
        }


        .container {
            width: 100%;
            max-width: 450px;
        }


        .logo {
            text-align: center;
            color: white;
            font-size: 32px;
            font-weight: 800;
            margin-bottom: 30px;
        }


        .logo span {
            color: #3288ff;
        }


        .card {
            background: white;
            border-radius: 20px;
            padding: 35px;
            box-shadow: 0 25px 70px rgba(0, 0, 0, 0.25);
        }


        h1 {
            font-size: 30px;
            margin-bottom: 8px;
        }


        .subtitle {
            color: #718096;
            margin-bottom: 28px;
            line-height: 1.5;
        }


        .form-group {
            margin-bottom: 20px;
        }


        label {
            display: block;
            font-weight: bold;
            margin-bottom: 8px;
            font-size: 14px;
        }


        input {
            width: 100%;
            padding: 14px;
            border: 1px solid #d8e0ed;
            border-radius: 10px;
            font-size: 16px;
            outline: none;
        }


        input:focus {
            border-color: #3288ff;
        }


        button {
            width: 100%;
            border: none;
            border-radius: 10px;
            padding: 16px;
            background: #2784f7;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }


        button:hover {
            background: #116fdc;
        }


        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }


        .message {
            display: none;
            padding: 14px;
            border-radius: 10px;
            margin-bottom: 20px;
            line-height: 1.4;
        }


        .error {
            background: #fff0f0;
            color: #b42318;
        }


        .success {
            background: #e7f8ed;
            color: #166534;
        }


        .signup {
            text-align: center;
            margin-top: 25px;
            color: #718096;
        }


        .signup a {
            color: #2784f7;
            font-weight: bold;
            text-decoration: none;
        }


        .back {
            display: block;
            text-align: center;
            margin-top: 20px;
            color: #aebfdd;
            text-decoration: none;
            font-size: 14px;
        }


        @media (max-width: 500px) {

            body {
                padding: 18px;
            }


            .card {
                padding: 25px 20px;
            }


            h1 {
                font-size: 26px;
            }

        }

    </style>

</head>


<body>


<div class="container">


    <div class="logo">
        Appointment<span>OS</span>
    </div>


    <div class="card">


        <h1>
            Welcome back
        </h1>


        <p class="subtitle">
            Log in to manage your appointments
            and your AppointmentOS account.
        </p>


        <div
            id="errorMessage"
            class="message error"
        ></div>


        <div
            id="successMessage"
            class="message success"
        ></div>


        <form id="loginForm">


            <div class="form-group">

                <label for="email">
                    Email
                </label>

                <input
                    id="email"
                    type="email"
                    placeholder="you@example.com"
                    required
                >

            </div>


            <div class="form-group">

                <label for="password">
                    Password
                </label>

                <input
                    id="password"
                    type="password"
                    placeholder="Enter your password"
                    required
                >

            </div>


            <button
                id="loginButton"
                type="submit"
            >
                Log in
            </button>


        </form>


        <div class="signup">

            Don't have an account?

            <a href="signup.html">
                Create one
            </a>

        </div>


    </div>


    <a
        href="index.html"
        class="back"
    >
        ← Back to AppointmentOS
    </a>


</div>



<script>


    // ==========================================
    // SUPABASE
    // ==========================================

    const SUPABASE_URL =
        "https://jnkfzfmijjdmtebrzrux.supabase.co";


    const SUPABASE_KEY =
        "sb_publishable_8hpsNfMPCgeP34IPnjhhrg_BVHKyHET";


    const { createClient } =
        supabase;


    const db =
        createClient(
            SUPABASE_URL,
            SUPABASE_KEY
        );



    // ==========================================
    // ELEMENTS
    // ==========================================

    const loginForm =
        document.getElementById(
            "loginForm"
        );


    const loginButton =
        document.getElementById(
            "loginButton"
        );


    const errorMessage =
        document.getElementById(
            "errorMessage"
        );


    const successMessage =
        document.getElementById(
            "successMessage"
        );



    // ==========================================
    // MESSAGES
    // ==========================================

    function showError(message) {

        successMessage.style.display =
            "none";

        errorMessage.textContent =
            message;

        errorMessage.style.display =
            "block";

    }


    function showSuccess(message) {

        errorMessage.style.display =
            "none";

        successMessage.textContent =
            message;

        successMessage.style.display =
            "block";

    }



    // ==========================================
    // LOGIN
    // ==========================================

    loginForm.addEventListener(
        "submit",
        async function(event) {

            event.preventDefault();


            const email =
                document.getElementById(
                    "email"
                ).value.trim();


            const password =
                document.getElementById(
                    "password"
                ).value;


            loginButton.disabled =
                true;


            loginButton.textContent =
                "Logging in...";


            const { data, error } =
                await db.auth.signInWithPassword({

                    email: email,

                    password: password

                });


            if (error) {

                console.error(error);


                showError(
                    error.message
                );


                loginButton.disabled =
                    false;


                loginButton.textContent =
                    "Log in";


                return;
            }


            if (!data.user) {

                showError(
                    "Login could not be completed."
                );


                loginButton.disabled =
                    false;


                loginButton.textContent =
                    "Log in";


                return;
            }


            showSuccess(
                "Login successful. Opening your account..."
            );


            /*
             * For now we send the user
             * to the dashboard.
             *
             * Later we will automatically
             * detect whether this is a
             * customer or business account.
             */

            setTimeout(function() {

                window.location.href =
                    "dashboard.html";

            }, 800);

        }
    );

</script>


</body>

</html>
