<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AppointmentOS - Create Business</title>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #071a3d;
            color: white;
        }

        header {
            background: #102852;
            padding: 20px 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .nav-links {
            display: flex;
            gap: 23px;
        } 
        
        .logo {
            font-size: 24px;
            font-weight: bold;
        }

        header a {
            color: white;
            text-decoration: none;
        }

        main {
            max-width: 650px;
            margin: 50px auto;
            padding: 20px;
        }

        .card {
            background: #102852;
            padding: 30px;
            border-radius: 12px;
        }

        h1 {
            margin-top: 0;
        }

        p {
            color: #d5def0;
        }

        label {
            display: block;
            margin-top: 18px;
            margin-bottom: 7px;
            font-weight: bold;
        }

        input,
        select,
        textarea {
            width: 100%;
            padding: 13px;
            border: none;
            border-radius: 7px;
            font-size: 16px;
        }

        textarea {
            min-height: 100px;
            resize: vertical;
        }

        button {
            width: 100%;
            margin-top: 25px;
            padding: 14px;
            border: none;
            border-radius: 7px;
            background: #ffffff;
            color: #071a3d;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            opacity: 0.9;
        }

        .message {
            margin-top: 20px;
            padding: 12px;
            border-radius: 7px;
            display: none;
        }

        .success {
            display: block;
            background: #1d6b45;
        }

        .error {
            display: block;
            background: #8b2635;
        }
    </style>
</head>

<body>

<header>
    <header>
    <div class="logo">AppointmentOS</div>

    <div class="nav-links">
        <a href="index.html">Home</a>
        <a href="dashboard.html">Dashboard</a>
    </div>
</header>


<main>
    <div class="card">

        <h1>Create Your Business</h1>

        <p>
            Add your business to AppointmentOS so customers can book appointments with you.
        </p>

        <form id="businessForm">

            <label for="name">Business Name</label>
            <input
                type="text"
                id="name"
                required
                placeholder="Example: Mpumelelo's Barber Shop"
            >

            <label for="businessType">Business Type</label>
            <select id="businessType" required>
                <option value="">Select business type</option>
                <option value="Barber & Salon">Barber & Salon</option>
                <option value="Restaurant">Restaurant</option>
                <option value="Medical">Medical</option>
                <option value="Legal">Legal</option>
                <option value="Fitness">Fitness</option>
                <option value="Real Estate">Real Estate</option>
                <option value="Automotive">Automotive</option>
                <option value="Other">Other</option>
            </select>

            <label for="phone">Phone</label>
            <input
                type="tel"
                id="phone"
                placeholder="Example: 0712345678"
            >

            <label for="email">Email</label>
            <input
                type="email"
                id="email"
                placeholder="business@example.com"
            >

            <label for="address">Address</label>
            <input
                type="text"
                id="address"
                placeholder="Business address"
            >

            <label for="description">Description</label>
            <textarea
                id="description"
                placeholder="Tell customers about your business"
            ></textarea>

            <button type="submit">Create Business</button>

            <div id="message" class="message"></div>

        </form>
    </div>
</main>

<script>

    // Supabase connection
    const SUPABASE_URL = "https://jnkfzfmijjdmtebrzrux.supabase.co";

    // PUT YOUR SUPABASE PUBLISHABLE / ANON KEY HERE
    const SUPABASE_KEY = "sb_publishable_8hpsNfMPCgeP34IPnjhhrg_BVHKyHET";

    const { createClient } = supabase;

    const db = createClient(
        SUPABASE_URL,
        SUPABASE_KEY
    );


    // Business form
    const form = document.getElementById("businessForm");
    const message = document.getElementById("message");


    form.addEventListener("submit", async function(event) {

        event.preventDefault();

        message.style.display = "none";
        message.textContent = "";


        const business = {
            name: document.getElementById("name").value.trim(),

            business_type:
                document.getElementById("businessType").value,

            phone:
                document.getElementById("phone").value.trim() || null,

            email:
                document.getElementById("email").value.trim() || null,

            address:
                document.getElementById("address").value.trim() || null,

            description:
                document.getElementById("description").value.trim() || null
        };


        console.log("Sending business:", business);


        const { error } = await db
            .from("businesses")
            .insert([business]);


        if (error) {

            console.error("Supabase error:", error);

            message.textContent =
                "Something went wrong: " + error.message;

            message.className = "message error";

            return;
        }


        message.textContent =
            "Business created successfully!";

        message.className =
            "message success";

        form.reset();

    });

</script>

</body>
</html>
