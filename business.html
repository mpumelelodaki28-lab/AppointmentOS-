<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Business Setup | AppointmentOS</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            background: #f5f7fb;
            color: #172033;
        }

        /* HEADER */
        header {
            height: 70px;
            background: #071a3d;
            color: white;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 7%;
        }

        .logo {
            font-size: 24px;
            font-weight: bold;
        }

        .logo span {
            color: #4da3ff;
        }

        .back {
            color: white;
            text-decoration: none;
            font-size: 15px;
        }

        /* MAIN */
        main {
            max-width: 850px;
            margin: 50px auto;
            padding: 0 20px;
        }

        .title {
            text-align: center;
            margin-bottom: 35px;
        }

        .title h1 {
            font-size: 34px;
            margin-bottom: 10px;
        }

        .title p {
            color: #667085;
            font-size: 16px;
        }

        /* CARD */
        .card {
            background: white;
            border-radius: 16px;
            padding: 35px;
            box-shadow: 0 8px 30px rgba(0,0,0,0.06);
        }

        .section-title {
            font-size: 20px;
            font-weight: bold;
            margin-bottom: 25px;
        }

        /* FORM */
        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            font-weight: bold;
            margin-bottom: 8px;
            font-size: 14px;
        }

        input,
        select,
        textarea {
            width: 100%;
            padding: 13px;
            border: 1px solid #d8dee9;
            border-radius: 8px;
            font-size: 15px;
            outline: none;
            background: white;
        }

        input:focus,
        select:focus,
        textarea:focus {
            border-color: #2779ff;
        }

        textarea {
            min-height: 100px;
            resize: vertical;
        }

        .row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        /* BUTTON */
        button {
            width: 100%;
            padding: 15px;
            border: none;
            border-radius: 9px;
            background: #0b2a63;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
        }

        button:hover {
            background: #123b82;
        }

        /* SUCCESS */
        .success {
            display: none;
            margin-top: 25px;
            padding: 18px;
            background: #eef8f0;
            border: 1px solid #b7dfbd;
            border-radius: 10px;
            color: #246b2d;
        }

        .success h3 {
            margin-bottom: 6px;
        }

        /* MOBILE */
        @media (max-width: 650px) {
            header {
                padding: 0 5%;
            }

            main {
                margin-top: 30px;
            }

            .title h1 {
                font-size: 28px;
            }

            .card {
                padding: 25px 20px;
            }

            .row {
                grid-template-columns: 1fr;
                gap: 0;
            }
        }
    </style>
</head>

<body>

<header>

    <div class="logo">
        Appointment<span>OS</span>
    </div>

    <a href="index.html" class="back">
        ← Back Home
    </a>

</header>


<main>

    <div class="title">

        <h1>Set Up Your Business</h1>

        <p>
            Create your business profile so customers can book appointments with you.
        </p>

    </div>


    <div class="card">

        <div class="section-title">
            Business Information
        </div>


        <form id="businessForm">

            <div class="form-group">

                <label for="businessName">
                    Business Name
                </label>

                <input
                    type="text"
                    id="businessName"
                    placeholder="e.g. Fresh Cuts Barber"
                    required
                >

            </div>


            <div class="form-group">

                <label for="businessType">
                    Business Type
                </label>

                <select id="businessType" required>

                    <option value="">
                        Select business type
                    </option>

                    <option>
                        Barber & Salon
                    </option>

                    <option>
                        Medical / Clinic
                    </option>

                    <option>
                        Dentist
                    </option>

                    <option>
                        Fitness / Gym
                    </option>

                    <option>
                        Consulting
                    </option>

                    <option>
                        Beauty
                    </option>

                    <option>
                        Other
                    </option>

                </select>

            </div>


            <div class="row">

                <div class="form-group">

                    <label for="phone">
                        Phone Number
                    </label>

                    <input
                        type="tel"
                        id="phone"
                        placeholder="e.g. 071 123 4567"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="email">
                        Business Email
                    </label>

                    <input
                        type="email"
                        id="email"
                        placeholder="business@example.com"
                        required
                    >

                </div>

            </div>


            <div class="form-group">

                <label for="address">
                    Business Address
                </label>

                <input
                    type="text"
                    id="address"
                    placeholder="e.g. 25 Main Street, Johannesburg"
                >

            </div>


            <div class="form-group">

                <label for="description">
                    About Your Business
                </label>

                <textarea
                    id="description"
                    placeholder="Tell customers a little about your business..."
                ></textarea>

            </div>


            <button type="submit">
                Create Business Profile
            </button>

        </form>


        <div class="success" id="successMessage">

            <h3>Business profile ready! ✓</h3>

            <p>
                Your business information has been entered successfully.
                Next, we'll connect this page to the AppointmentOS online database.
            </p>

        </div>

    </div>

</main>


<script>

    const form = document.getElementById("businessForm");

    const successMessage = document.getElementById("successMessage");


    form.addEventListener("submit", function(event) {

        event.preventDefault();

        successMessage.style.display = "block";

        successMessage.scrollIntoView({
            behavior: "smooth"
        });

    });

</script>

</body>
</html>
