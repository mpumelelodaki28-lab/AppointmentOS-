<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Business Setup | AppointmentOS</title>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            background: #f5f7fb;
            color: #172033;
        }

        header {
            height: 70px;
            background: #071a3d;
            color: white;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 7%;
        }

        .logo {
            font-size: 24px;
            font-weight: bold;
        }

        .logo span {
            color: #4da3ff;
        }

        .back {
            color: white;
            text-decoration: none;
        }

        main {
            max-width: 850px;
            margin: 50px auto;
            padding: 0 20px;
        }

        .title {
            text-align: center;
            margin-bottom: 35px;
        }

        .title h1 {
            font-size: 34px;
            margin-bottom: 10px;
        }

        .title p {
            color: #667085;
        }

        .card {
            background: white;
            border-radius: 16px;
            padding: 35px;
            box-shadow: 0 8px 30px rgba(0,0,0,0.06);
        }

        .section-title {
            font-size: 20px;
            font-weight: bold;
            margin-bottom: 25px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            font-weight: bold;
            margin-bottom: 8px;
            font-size: 14px;
        }

        input,
        select,
        textarea {
            width: 100%;
            padding: 13px;
            border: 1px solid #d8dee9;
            border-radius: 8px;
            font-size: 15px;
            outline: none;
            background: white;
        }

        input:focus,
        select:focus,
        textarea:focus {
            border-color: #2779ff;
        }

        textarea {
            min-height: 100px;
            resize: vertical;
        }

        .row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        button {
            width: 100%;
            padding: 15px;
            border: none;
            border-radius: 9px;
            background: #0b2a63;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #123b82;
        }

        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .message {
            display: none;
            margin-top: 20px;
            padding: 16px;
            border-radius: 9px;
        }

        .success {
            background: #eef8f0;
            border: 1px solid #b7dfbd;
            color: #246b2d;
        }

        .error {
            background: #fff1f1;
            border: 1px solid #e0b5b5;
            color: #a12626;
        }

        @media (max-width: 650px) {
            header {
                padding: 0 5%;
            }

            .title h1 {
                font-size: 28px;
            }

            .card {
                padding: 25px 20px;
            }

            .row {
                grid-template-columns: 1fr;
                gap: 0;
            }
        }
    </style>
</head>

<body>

<header>

    <div class="logo">
        Appointment<span>OS</span>
    </div>

    <a href="index.html" class="back">
        ← Back Home
    </a>

</header>


<main>

    <div class="title">

        <h1>Set Up Your Business</h1>

        <p>
            Create your business profile so customers can book appointments.
        </p>

    </div>


    <div class="card">

        <div class="section-title">
            Business Information
        </div>


        <form id="businessForm">

            <div class="form-group">

                <label for="businessName">
                    Business Name
                </label>

                <input
                    type="text"
                    id="businessName"
                    placeholder="e.g. Fresh Cuts Barber"
                    required
                >

            </div>


            <div class="form-group">

                <label for="businessType">
                    Business Type
                </label>

                <select id="businessType" required>

                    <option value="">
                        Select business type
                    </option>

                    <option value="Barber & Salon">
                        Barber & Salon
                    </option>

                    <option value="Medical / Clinic">
                        Medical / Clinic
                    </option>

                    <option value="Dentist">
                        Dentist
                    </option>

                    <option value="Fitness / Gym">
                        Fitness / Gym
                    </option>

                    <option value="Consulting">
                        Consulting
                    </option>

                    <option value="Beauty">
                        Beauty
                    </option>

                    <option value="Other">
                        Other
                    </option>

                </select>

            </div>


            <div class="row">

                <div class="form-group">

                    <label for="phone">
                        Phone Number
                    </label>

                    <input
                        type="tel"
                        id="phone"
                        placeholder="071 123 4567"
                    >

                </div>


                <div class="form-group">

                    <label for="email">
                        Business Email
                    </label>

                    <input
                        type="email"
                        id="email"
                        placeholder="business@example.com"
                    >

                </div>

            </div>


            <div class="form-group">

                <label for="address">
                    Business Address
                </label>

                <input
                    type="text"
                    id="address"
                    placeholder="e.g. 25 Main Street, Johannesburg"
                >

            </div>


            <div class="form-group">

                <label for="description">
                    About Your Business
                </label>

                <textarea
                    id="description"
                    placeholder="Tell customers about your business..."
                ></textarea>

            </div>


            <button type="submit" id="submitButton">
                Create Business Profile
            </button>

        </form>


        <div id="successMessage" class="message success">
            Business profile saved successfully! ✓
        </div>


        <div id="errorMessage" class="message error">
            Something went wrong. Please try again.
        </div>

    </div>

</main>


<script>

    // ==========================================
    // SUPABASE CONNECTION
    // ==========================================

    const SUPABASE_URL = "https://jnkfzfmijjdmtebrzrux.supabase.co";

    const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Impua2Z6Zm1pampkbXRlYnJ6cnV4Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODg4ODA4NTUsImV4cCI6MjEwNDQ1Njg1NX0.SifyI2RnWTXPeTuYSU9IaG-0GYUYBlKcflZvYBSivtY";


    const supabaseClient =
        window.supabase.createClient(
            SUPABASE_URL,
            SUPABASE_ANON_KEY
        );


    // ==========================================
    // FORM
    // ==========================================

    const form =
        document.getElementById("businessForm");

    const submitButton =
        document.getElementById("submitButton");

    const successMessage =
        document.getElementById("successMessage");

    const errorMessage =
        document.getElementById("errorMessage");


    form.addEventListener("submit", async function(event) {

        event.preventDefault();


        successMessage.style.display = "none";
        errorMessage.style.display = "none";

        submitButton.disabled = true;
        submitButton.textContent = "Saving...";


        const businessName =
            document.getElementById("businessName").value.trim();

        const businessType =
            document.getElementById("businessType").value;

        const phone =
            document.getElementById("phone").value.trim();

        const email =
            document.getElementById("email").value.trim();

        const address =
            document.getElementById("address").value.trim();

        const description =
            document.getElementById("description").value.trim();


        try {

            const { data, error } =
                await supabaseClient
                .from("businesses")
                .insert([
                    {
                        name: businessName,
                        business_type: businessType,
                        phone: phone,
                        email: email,
                        address: address,
                        description: description
                    }
                ])
                .select();


            if (error) {
                throw error;
            }


            console.log("Business created:", data);


            successMessage.style.display = "block";

            form.reset();

        }

        catch (error) {

            console.error(error);

            errorMessage.textContent =
                "Error saving business: " + error.message;

            errorMessage.style.display = "block";

        }

        finally {

            submitButton.disabled = false;

            submitButton.textContent =
                "Create Business Profile";

        }

    });

</script>

</body>
</html>
