<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AppointmentOS - Create Business</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background: #f5f7fb;
      color: #172033;
    }

    header {
      background: #0b1f3a;
      color: white;
      padding: 20px 7%;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .logo {
      font-size: 24px;
      font-weight: bold;
    }

    header a {
      color: white;
      text-decoration: none;
    }

    .container {
      max-width: 700px;
      margin: 50px auto;
      padding: 0 20px;
    }

    .card {
      background: white;
      padding: 35px;
      border-radius: 18px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.08);
    }

    h1 {
      margin-bottom: 10px;
      font-size: 32px;
    }

    .subtitle {
      color: #667085;
      margin-bottom: 30px;
      line-height: 1.5;
    }

    label {
      display: block;
      font-weight: bold;
      margin: 18px 0 8px;
    }

    input,
    select,
    textarea {
      width: 100%;
      padding: 14px;
      border: 1px solid #d5d9e2;
      border-radius: 10px;
      font-size: 16px;
      outline: none;
    }

    input:focus,
    select:focus,
    textarea:focus {
      border-color: #0b1f3a;
    }

    textarea {
      min-height: 110px;
      resize: vertical;
    }

    button {
      width: 100%;
      margin-top: 25px;
      padding: 15px;
      border: none;
      border-radius: 10px;
      background: #0b1f3a;
      color: white;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
    }

    button:hover {
      background: #16365f;
    }

    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .message {
      margin-top: 20px;
      padding: 15px;
      border-radius: 10px;
      display: none;
      line-height: 1.5;
    }

    .success {
      background: #e8f7ee;
      color: #176b3a;
    }

    .error {
      background: #fdecec;
      color: #a32626;
    }

    .back {
      display: inline-block;
      margin-bottom: 25px;
      color: #0b1f3a;
      text-decoration: none;
      font-weight: bold;
    }

    @media (max-width: 600px) {
      .container {
        margin: 25px auto;
      }

      .card {
        padding: 25px 20px;
      }

      h1 {
        font-size: 27px;
      }
    }
  </style>
</head>

<body>

<header>
  <div class="logo">AppointmentOS</div>
  <a href="index.html">Home</a>
</header>

<div class="container">

  <a class="back" href="index.html">← Back to home</a>

  <div class="card">

    <h1>Create your business</h1>

    <p class="subtitle">
      Set up your business on AppointmentOS and prepare to start receiving
      online appointments.
    </p>

    <form id="businessForm">

      <label for="name">Business name</label>
      <input
        type="text"
        id="name"
        placeholder="e.g. Mpumelelo Barber Shop"
        required
      >

      <label for="business_type">Business type</label>
      <select id="business_type" required>
        <option value="">Choose a business type</option>
        <option value="Barber">Barber</option>
        <option value="Salon">Salon</option>
        <option value="Doctor">Doctor</option>
        <option value="Dentist">Dentist</option>
        <option value="Restaurant">Restaurant</option>
        <option value="Fitness">Fitness</option>
        <option value="Beauty">Beauty</option>
        <option value="Consulting">Consulting</option>
        <option value="Other">Other</option>
      </select>

      <label for="phone">Phone number</label>
      <input
        type="tel"
        id="phone"
        placeholder="e.g. 0712345678"
      >

      <label for="email">Business email</label>
      <input
        type="email"
        id="email"
        placeholder="e.g. business@example.com"
      >

      <label for="address">Business address</label>
      <input
        type="text"
        id="address"
        placeholder="e.g. Johannesburg, Gauteng"
      >

      <label for="description">Business description</label>
      <textarea
        id="description"
        placeholder="Tell customers about your business..."
      ></textarea>

      <button type="submit" id="submitButton">
        Create Business
      </button>

      <div id="message" class="message"></div>

    </form>

  </div>
</div>

<script>

  // ==========================================
  // SUPABASE CONNECTION
  // ==========================================

  const SUPABASE_URL = "https://jnkfzfmijjdmtebrzrux.supabase.co";
  const SUPABASE_KEY = "sb_publishable_8hpsNfMPCgeP34IPnjhhrg_BVHKyHET";

  const { createClient } = supabase;

  const db = createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );


  // ==========================================
  // FORM
  // ==========================================

  const form = document.getElementById("businessForm");
  const button = document.getElementById("submitButton");
  const message = document.getElementById("message");


  form.addEventListener("submit", async function(event) {

    event.preventDefault();

    button.disabled = true;
    button.textContent = "Creating business...";

    message.style.display = "none";

    const business = {
      name: document.getElementById("name").value.trim(),
      business_type: document.getElementById("business_type").value,
      phone: document.getElementById("phone").value.trim() || null,
      email: document.getElementById("email").value.trim() || null,
      address: document.getElementById("address").value.trim() || null,
      description: document.getElementById("description").value.trim() || null
    };


    // ==========================================
    // SEND BUSINESS TO SUPABASE
    // ==========================================

    const { error } = await db
      .from("businesses")
      .insert([business]);

    if (error) {
        message.textContent = "Something went wrong: " + error.message;
        message.className = "message error";
        return;
}

message.textContent = "Business created successfully! 🎉";
message.className = "message success";
form.reset();


    // ==========================================
    // SUCCESS
    // ==========================================

    message.className = "message success";
    message.style.display = "block";

    message.innerHTML =
      "<strong>Business created successfully! 🎉</strong><br>" +
      "Your business has been saved to AppointmentOS.";

    form.reset();

    button.disabled = false;
    button.textContent = "Create Business";

  });

</script>

</body>
</html>
