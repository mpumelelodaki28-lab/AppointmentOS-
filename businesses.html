<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Find a Business | AppointmentOS</title>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            background: #f5f7fb;
            color: #0b1838;
        }

        header {
            height: 90px;
            background: #06183d;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 6%;
        }

        .logo {
            color: white;
            font-size: 35px;
            font-weight: 800;
        }

        .logo span {
            color: #3288ff;
        }

        .business-link {
            color: white;
            text-decoration: none;
            border: 1px solid white;
            padding: 12px 22px;
            border-radius: 9px;
        }

        .business-link:hover {
            background: white;
            color: #06183d;
        }

        .hero {
            background: #06183d;
            color: white;
            padding: 65px 20px 80px;
            text-align: center;
        }

        .hero h1 {
            font-size: 50px;
            margin-bottom: 15px;
        }

        .hero h1 span {
            color: #3288ff;
        }

        .hero p {
            color: #b9c9e4;
            font-size: 19px;
            margin-bottom: 30px;
        }

        .search {
            width: 100%;
            max-width: 650px;
            padding: 17px 20px;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            outline: none;
        }

        .categories {
            max-width: 1150px;
            margin: 35px auto 0;
            padding: 0 20px;
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .category {
            border: 1px solid #d8e0ed;
            background: white;
            color: #233453;
            padding: 11px 17px;
            border-radius: 30px;
            cursor: pointer;
            font-weight: 600;
        }

        .category.active,
        .category:hover {
            background: #2784f7;
            color: white;
            border-color: #2784f7;
        }

        main {
            max-width: 1200px;
            margin: auto;
            padding: 50px 20px 90px;
        }

        .section-heading {
            margin-bottom: 25px;
        }

        .section-heading h2 {
            font-size: 30px;
            margin-bottom: 7px;
        }

        .section-heading p {
            color: #718096;
        }

        .business-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 25px;
        }

        .business-card {
            background: white;
            border-radius: 18px;
            overflow: hidden;
            box-shadow: 0 8px 30px rgba(10, 35, 75, 0.08);
            transition: 0.25s;
        }

        .business-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 15px 40px rgba(10, 35, 75, 0.14);
        }

        .business-image {
            width: 100%;
            height: 210px;
            object-fit: cover;
            display: block;
        }

        .business-content {
            padding: 22px;
        }

        .business-type {
            color: #2784f7;
            font-size: 13px;
            font-weight: bold;
            text-transform: uppercase;
            margin-bottom: 8px;
        }

        .business-name {
            font-size: 23px;
            margin-bottom: 9px;
        }

        .location {
            color: #68738a;
            font-size: 14px;
            margin-bottom: 12px;
        }

        .description {
            color: #69758a;
            font-size: 14px;
            line-height: 1.5;
            min-height: 42px;
            margin-bottom: 20px;
        }

        .book-button {
            display: block;
            width: 100%;
            text-align: center;
            text-decoration: none;
            background: #2784f7;
            color: white;
            padding: 13px;
            border-radius: 9px;
            font-weight: bold;
        }

        .book-button:hover {
            background: #116fdc;
        }

        .loading,
        .empty {
            text-align: center;
            padding: 50px 20px;
            color: #718096;
            grid-column: 1 / -1;
        }

        .error {
            background: #fff0f0;
            color: #b42318;
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 25px;
            display: none;
        }

        footer {
            background: #031332;
            color: #91a6c8;
            text-align: center;
            padding: 35px 20px;
        }

        .footer-logo {
            color: white;
            font-size: 24px;
            font-weight: bold;
            margin-bottom: 10px;
        }

        .footer-logo span {
            color: #3288ff;
        }

        @media (max-width: 900px) {
            .business-grid {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        @media (max-width: 600px) {

            header {
                height: 75px;
                padding: 0 18px;
            }

            .logo {
                font-size: 25px;
            }

            .business-link {
                font-size: 14px;
                padding: 9px 13px;
            }

            .hero {
                padding: 50px 18px 60px;
            }

            .hero h1 {
                font-size: 38px;
            }

            .hero p {
                font-size: 17px;
            }

            .business-grid {
                grid-template-columns: 1fr;
            }

            main {
                padding-top: 35px;
            }
        }
    </style>
</head>

<body>

<header>

    <div class="logo">
        Appointment<span>OS</span>
    </div>

    <a href="business.html" class="business-link">
        I'm a Business
    </a>

</header>


<section class="hero">

    <h1>
        Find your <span>business</span>
    </h1>

    <p>
        Discover businesses and book your next appointment.
    </p>

    <input
        type="text"
        id="search"
        class="search"
        placeholder="Search for a business..."
    >

</section>


<div class="categories">

    <button class="category active" data-category="All">
        All
    </button>

    <button class="category" data-category="Barber & Salon">
        Barber & Salon
    </button>

    <button class="category" data-category="Healthcare">
        Healthcare
    </button>

    <button class="category" data-category="Legal">
        Legal
    </button>

    <button class="category" data-category="Real Estate">
        Real Estate
    </button>

    <button class="category" data-category="Fitness">
        Fitness
    </button>

    <button class="category" data-category="Education">
        Education
    </button>

</div>


<main>

    <div class="section-heading">

        <h2>Businesses near you</h2>

        <p>
            Choose a business to view its services and book.
        </p>

    </div>

    <div id="errorMessage" class="error"></div>

    <div
        id="businessGrid"
        class="business-grid"
    >

        <div class="loading">
            Loading businesses...
        </div>

    </div>

</main>


<footer>

    <div class="footer-logo">
        Appointment<span>OS</span>
    </div>

    <p>
        © 2026 AppointmentOS. All rights reserved.
    </p>

</footer>


<script>

    // ==========================================
    // SUPABASE
    // ==========================================

    const SUPABASE_URL =
        "https://jnkfzfmijjdmtebrzrux.supabase.co";

    const SUPABASE_KEY =
        "sb_publishable_8hpsNfMPCgeP34IPnjhhrg_BVHKyHET";

    const { createClient } = supabase;

    const db = createClient(
        SUPABASE_URL,
        SUPABASE_KEY
    );


    // ==========================================
    // VARIABLES
    // ==========================================

    let businesses = [];

    let selectedCategory = "All";

    const grid =
        document.getElementById("businessGrid");

    const search =
        document.getElementById("search");

    const errorMessage =
        document.getElementById("errorMessage");


    // ==========================================
    // BUSINESS IMAGES
    // ==========================================

    function getBusinessImage(type) {

        const images = {

            "Barber & Salon":
                "https://images.unsplash.com/photo-1560066984-138dadb4c035?auto=format&fit=crop&w=900&q=80",

            "Healthcare":
                "https://images.unsplash.com/photo-1519494026892-80bbd2d6fd0d?auto=format&fit=crop&w=900&q=80",

            "Legal":
                "https://images.unsplash.com/photo-1505664194779-8beaceb93744?auto=format&fit=crop&w=900&q=80",

            "Real Estate":
                "https://images.unsplash.com/photo-1560518883-ce09059eeffa?auto=format&fit=crop&w=900&q=80",

            "Fitness":
                "https://images.unsplash.com/photo-1534438327276-14e5300c3a48?auto=format&fit=crop&w=900&q=80",

            "Education":
                "https://images.unsplash.com/photo-1523050854058-8df90110c9f1?auto=format&fit=crop&w=900&q=80",

            "Beauty":
                "https://images.unsplash.com/photo-1562322140-8baeececf3df?auto=format&fit=crop&w=900&q=80",

            "Automotive":
                "https://images.unsplash.com/photo-1487754180451-c456f719a1fc?auto=format&fit=crop&w=900&q=80"

        };

        return images[type] ||
            "https://images.unsplash.com/photo-1497366754035-f200968a6e72?auto=format&fit=crop&w=900&q=80";
    }


    // ==========================================
    // LOAD BUSINESSES
    // ==========================================

    async function loadBusinesses() {

        const { data, error } = await db
            .from("businesses")
            .select("*")
            .order("created_at", {
                ascending: false
            });


        if (error) {

            console.error(
                "Business loading error:",
                error
            );

            errorMessage.textContent =
                "Could not load businesses: " +
                error.message;

            errorMessage.style.display =
                "block";

            grid.innerHTML = "";

            return;
        }


        businesses = data || [];

        renderBusinesses();
    }


    // ==========================================
    // RENDER BUSINESSES
    // ==========================================

    function renderBusinesses() {

        const searchText =
            search.value
                .trim()
                .toLowerCase();


        const filtered =
            businesses.filter(function(business) {

                const matchesCategory =
                    selectedCategory === "All" ||
                    business.business_type ===
                    selectedCategory;


                const matchesSearch =
                    !searchText ||

                    (business.name || "")
                        .toLowerCase()
                        .includes(searchText) ||

                    (business.business_type || "")
                        .toLowerCase()
                        .includes(searchText) ||

                    (business.address || "")
                        .toLowerCase()
                        .includes(searchText);


                return matchesCategory &&
                       matchesSearch;

            });


        if (filtered.length === 0) {

            grid.innerHTML = `
                <div class="empty">

                    <h3>
                        No businesses found
                    </h3>

                    <p>
                        Try another search or category.
                    </p>

                </div>
            `;

            return;
        }


        grid.innerHTML =
            filtered.map(function(business) {

                /*
                 * IMPORTANT FIX
                 *
                 * We now use the database ID.
                 *
                 * This works even when the
                 * business slug is NULL.
                 */

                const businessId =
                    business.id;


                return `

                    <article class="business-card">

                        <img
                            class="business-image"
                            src="${getBusinessImage(
                                business.business_type
                            )}"
                            alt="${business.name || "Business"}"
                        >

                        <div class="business-content">

                            <div class="business-type">
                                ${business.business_type || "Business"}
                            </div>

                            <h3 class="business-name">
                                ${business.name || "Unnamed Business"}
                            </h3>

                            <div class="location">
                                ${business.address || "Location not provided"}
                            </div>

                            <p class="description">

                                ${
                                    business.description ||
                                    "View this business and book an appointment."
                                }

                            </p>

                            <a
                                class="book-button"
                                href="booking.html?business_id=${businessId}"
                            >
                                View & Book
                            </a>

                        </div>

                    </article>

                `;

            }).join("");
    }


    // ==========================================
    // SEARCH
    // ==========================================

    search.addEventListener(
        "input",
        renderBusinesses
    );


    // ==========================================
    // CATEGORY BUTTONS
    // ==========================================

    document
        .querySelectorAll(".category")
        .forEach(function(button) {

            button.addEventListener(
                "click",
                function() {

                    document
                        .querySelectorAll(".category")
                        .forEach(function(btn) {

                            btn.classList.remove(
                                "active"
                            );

                        });


                    button.classList.add("active");


                    selectedCategory =
                        button.dataset.category;


                    renderBusinesses();

                }
            );

        });


    // ==========================================
    // START
    // ==========================================

    loadBusinesses();

</script>

</body>
</html>
